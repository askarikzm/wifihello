global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: "backend"
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:9000"]

  - job_name: "network-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["network-service:9100"]

  - job_name: "payment-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["payment-service:9200"]

  - job_name: "radius-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["radius-service:9300"]

  - job_name: "infra"
    static_configs:
      - targets: ["nginx:9113", "redis:9121"]
