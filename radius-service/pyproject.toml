[project]
name = "radius-service"
version = "0.1.0"
description = "NetAxis RADIUS AAA Service for ISP subscriber authentication"
requires-python = ">=3.11"

dependencies = [
    "pyrad>=2.4",
    "supabase>=2.0.0",
    "python-dotenv>=1.0.0",
    "structlog>=23.0.0",
    "asyncio>=3.4.3",
    "aiohttp>=3.9.0",
    "cryptography>=41.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W"]
